name: Bench Readme

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "benches/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/update_readme_bench.sh"
      - "scripts/readme_bench_tables.py"
      - ".github/workflows/bench-readme.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vs-bitvec-readme:
    name: compare bench + README check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run compare benchmarks
        run: cargo bench --bench compare

      - name: Check README benchmark tables
        id: readme_check
        run: |
          set +e
          scripts/update_readme_bench.sh --check-structure
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "${status}" -eq 1 ]]; then
            echo "structural_mismatch=1" >> "$GITHUB_OUTPUT"
          else
            echo "structural_mismatch=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Render benchmark comment
        id: bench_comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        run: |
          set -euo pipefail
          args=(--comment)
          if [[ "${{ steps.readme_check.outputs.structural_mismatch }}" == "1" ]]; then
            args+=(--readme-stale)
          fi
          python3 scripts/readme_bench_tables.py "${args[@]}" > "${RUNNER_TEMP}/bench-comment.md"

      - name: Comment benchmark report on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        env:
          COMMENT_PATH: ${{ runner.temp }}/bench-comment.md
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- bench-readme-check -->";
            const body = fs.readFileSync(process.env.COMMENT_PATH, "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                typeof comment.body === "string" &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  vs-bitflags-smoke:
    name: vs_bitflags benchmark smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run vs_bitflags benchmarks
        run: cargo bench --bench vs_bitflags -- --sample-size 20 --warm-up-time 0.1 --measurement-time 0.2
